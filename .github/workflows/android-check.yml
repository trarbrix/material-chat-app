name: Check Android build
on:
  push:
    branches: ['arena/c334ccb2-material-chat-app']
    paths: ['android-app/**', 'variant-b.html', '.github/workflows/android-check.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile Android wrapper
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

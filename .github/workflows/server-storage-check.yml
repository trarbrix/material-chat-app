name: Test server storage
on:
  push:
    branches: ['arena/c334ccb2-material-chat-app']
    paths: ['server/**', 'tests/test_*api.py', '.github/workflows/server-storage-check.yml']
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MATERIAL_CHAT_TEST_POSTGRES_URL: postgresql+psycopg://postgres:test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r server/requirements.txt httpx
      - name: Test SQLite and PostgreSQL
        run: python -m unittest discover -s tests -p 'test_*api.py' -v

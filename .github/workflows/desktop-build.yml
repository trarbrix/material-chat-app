name: Build desktop beta
on:
  workflow_dispatch:
  push:
    branches: ['arena/c334ccb2-material-chat-app']
    paths: ['desktop/**', 'variant-b.html', '.github/workflows/desktop-build.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-14
            target: mac
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install build dependencies
        working-directory: desktop
        run: npm ci
      - name: Test local server
        working-directory: desktop
        run: npm test
      - name: Build installers
        working-directory: desktop
        run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Material-Chat-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.deb
            desktop/dist/*.rpm
